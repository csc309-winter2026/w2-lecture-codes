<html>

<head>
  <style>
    .container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .container div {
      background-color: #f0f0f0;
      padding: 20px;
      text-align: center;
      border: 1px solid #ccc;
    }

    .container div.selected {
      background-color: #add8e6;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <script>
    let p2 = document.querySelector('p');
    p2.innerText += ' I will not have any impact!';
  </script>

  <h1>Welcome to My Website</h1>
  <p>This is a sample HTML file.</p>

  <button>I was clicked 0 times</button>

  <div class="container">
    <div class="selected">1</div>
    <div>2</div>
    <div>3</div>
    <div>4</div>
    <div>5</div>
    <div>6</div>
  </div>

  <script>
    let p = document.querySelector('p');
    p.innerText += ' Enjoy your stay!';

    let button = document.querySelector('button');
    let count = 0;
    button.onclick = function () {
      count++;
      button.innerText = `I was clicked ${count} times`;

      let selectedDiv = document.querySelector('.container div.selected');
      selectedDiv.classList.remove('selected');
      let nextDiv = selectedDiv.nextElementSibling;
      if (nextDiv) {
        nextDiv.classList.add('selected');
      } else {
        document.querySelector('.container div').classList.add('selected');

      }
    };
  </script>
</body>

</html>
